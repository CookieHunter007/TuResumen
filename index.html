<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="author" content="Jesus Alfredo Garcia Luquez">
<meta name="copyright" content="© 2026 Jesus Alfredo Garcia Luquez. Todos los derechos reservados.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Tarjetas BBVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Resúmenes de tarjeta · BBVA Argentina</div>
      <h1>Mis Tarjetas BBVA</h1>
      <p>Subí los PDF de tus resúmenes de Visa y Mastercard. Se leen en tu navegador y no se envían a ningún lado.</p>
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <section class="drop" id="drop">
    <div class="chips" id="chips"></div>
    <div class="drop-actions">
      <span class="status" id="status"></span>
      <label class="btn primary" for="file">Subir resúmenes PDF</label>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
      <span id="clearbox"><button class="btn small" id="clear" type="button">Borrar todo</button></span>
    </div>
  </section>

  <div id="main"></div>
  <footer class="site-footer">© 2026 Jesus Alfredo Garcia Luquez. Todos los derechos reservados.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="js/parser.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
