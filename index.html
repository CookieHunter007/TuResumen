<head>

<style>
/* Layout: control bar, then a statement ledger: figures strip → paired panels → full movement table */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#101a30; --muted:#5a6680; --line:#dde3ee; --soft:#eef2f8;
  --accent:#1d55c9; --visa:#1d55c9; --mc:#c9660f; --usd:#0d8a7b; --good:#177a3c; --warn:#b4471a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1120; --surface:#131c2e; --ink:#e7ecf6; --muted:#97a3bb; --line:#24314a; --soft:#18233a;
  --accent:#7aa2ff; --visa:#7aa2ff; --mc:#f0a04b; --usd:#3fc7b4; --good:#4ccb7c; --warn:#f08a5d; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1120; --surface:#131c2e; --ink:#e7ecf6; --muted:#97a3bb; --line:#24314a; --soft:#18233a;
  --accent:#7aa2ff; --visa:#7aa2ff; --mc:#f0a04b; --usd:#3fc7b4; --good:#4ccb7c; --warn:#f08a5d; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 56px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
header.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.small{padding:5px 10px;font-size:.85rem;font-weight:500}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 10px;font-size:.85rem;background:var(--soft)}
.chip .dot,.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.chip button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:2px 6px;border-radius:50%}
.chip button:hover{background:var(--line);color:var(--ink)}
.status{font-size:.88rem}
.status.err{color:var(--warn)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.88rem;border:0;background:transparent;color:var(--muted);padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:600}
select,input[type=search]{font:inherit;font-size:.9rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-num);font-size:1.45rem;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.82rem;color:var(--muted)}
.kpi .v .usd{color:var(--usd)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.9rem}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px;background:var(--soft);border-radius:3px;display:flex;overflow:hidden}
.bar .seg1{background:var(--visa)} .bar .seg2{background:var(--mc)}
.bar .val{text-align:right;font-family:var(--f-num);font-size:.85rem;white-space:nowrap}
.bar .val small{color:var(--usd);display:block;font-size:.75rem}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cols{display:flex;align-items:flex-end;gap:8px;height:190px;padding-top:18px;border-bottom:1px solid var(--line);position:relative}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;position:relative;min-width:0}
.col .stack{display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden}
.col .tot{font-family:var(--f-num);font-size:.68rem;text-align:center;color:var(--muted);margin-bottom:4px;white-space:nowrap}
.col.rest .stack{opacity:.55}
.collabs{display:flex;gap:8px}
.collabs span{flex:1;text-align:center;font-size:.75rem;color:var(--muted);min-width:0}
.taxes{display:flex;flex-direction:column}
.taxrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.taxrow:last-child{border-bottom:0}
.taxrow .num{white-space:nowrap}
.taxrow.total{font-weight:600}
.neg{color:var(--good)}
.tablewrap{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:720px}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td select{padding:3px 6px;font-size:.82rem}
.pill{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--f-num);white-space:nowrap}
.pill.ref{color:var(--good)}
.checks{display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.ok{color:var(--good);font-weight:600}.bad{color:var(--warn);font-weight:600}
.note{font-size:.82rem;color:var(--muted);margin:0}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:.88rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,6.5rem) minmax(0,1fr) auto}.kpi .v{font-size:1.25rem}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Resúmenes de tarjeta · BBVA Argentina</div>
      <h1>Mis Tarjetas BBVA</h1>
      <p>Subí los PDF de tus resúmenes de Visa y Mastercard. Se leen en tu navegador y no se envían a ningún lado.</p>
    </div>
    <div class="filters" id="filters"></div>
  </header>

  <section class="drop" id="drop">
    <div class="chips" id="chips"></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="status" id="status"></span>
      <label class="btn primary" for="file">Subir resúmenes PDF</label>
      <input id="file" type="file" accept="application/pdf,.pdf" multiple hidden>
      <span id="clearbox"><button class="btn small" id="clear" type="button">Borrar todo</button></span>
    </div>
  </section>

  <div id="main"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// BBVA Argentina credit-card statement parser. Input: pages = [[{x,y,s}]] (PDF text items, y grows upward).
const MESES = {ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,SET:9,OCT:10,NOV:11,DIC:12};
const MONEY = /^-?\$?\s?[\d.]+,\d{2}-?$/;
function num(s){ s=String(s).replace(/[$\s]/g,''); let neg=false; if(s.endsWith('-')){neg=true;s=s.slice(0,-1);} if(s.startsWith('-')){neg=true;s=s.slice(1);} const v=parseFloat(s.replace(/\./g,'').replace(',','.')); return neg?-v:v; }
function fecha(s){ const m=/^(\d{1,2})-([A-Za-z]{3})-(\d{2})$/.exec(s.trim()); if(!m) return null; const mo=MESES[m[2].toUpperCase()]; if(!mo) return null; return `20${m[3]}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
function rowsOf(items){
  const its=items.filter(i=>i.s.trim()).sort((a,b)=>b.y-a.y||a.x-b.x); const rows=[];
  for(const it of its){ const r=rows[rows.length-1]; if(r && Math.abs(r.y-it.y)<=3){ r.items.push(it);} else rows.push({y:it.y,items:[it]}); }
  for(const r of rows){ r.items.sort((a,b)=>a.x-b.x); r.text=r.items.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim(); }
  return rows;
}
// values under a row of labels: assign each value to the label with the largest x <= value.x+8
function labelValues(rows, labelMatch, labels){
  for(let i=0;i<rows.length;i++){
    if(!labelMatch.test(rows[i].text)) continue;
    const lx=[]; for(const lab of labels){ const it=rows[i].items.find(t=>t.s.toUpperCase().startsWith(lab)); lx.push(it?it.x:null); }
    const out={}; const y0=rows[i].y;
    for(let j=i+1;j<rows.length && rows[j].y>y0-22;j++) for(const it of rows[j].items){
      let best=-1; lx.forEach((x,k)=>{ if(x!=null && x<=it.x+8 && (best<0||x>lx[best])) best=k; });
      if(best>=0){ out[labels[best]]=((out[labels[best]]||'')+' '+it.s).trim(); }
    }
    return out;
  }
  return {};
}
function normMerchant(d){
  let s=d.toUpperCase().replace(/\s+/g,' ').trim();
  s=s.replace(/^(DLO|MERPAGO|PAYU\*AR|PAYU|WL|MP|DLOCAL|EBANX|PAYPAL)\s?\*\s?/,'');
  if(/^PEDIDOSYA/.test(s)) return /PROPINA/.test(s)?'PEDIDOSYA PROPINA':/MARKET/.test(s)?'PEDIDOSYA MARKET':'PEDIDOSYA';
  s=s.replace(/^GOOGLE \*/,'GOOGLE ').replace(/\.COM(\.AR)?$/,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  if(/^PRIME ?VIDEO/.test(s)) return 'PRIMEVIDEO';
  if(/^STEAM/.test(s)) return 'STEAM';
  if(/^MICROSOFT/.test(s)) return 'MICROSOFT';
  return s;
}
function parseStatement(pages){
  const pageRows=pages.map(rowsOf); const r1=pageRows[0]||[]; const all=pageRows.flat();
  const full=all.map(r=>r.text).join('\n');
  const st={brand:null,card:null,cuenta:null,cierre:null,vencimiento:null,saldoARS:null,saldoUSD:null,minimo:null,proxCierre:null,proxVenc:null,cierreAnt:null,tnaARS:null,cuotasFuturas:[],totalesConsumo:{ars:0,usd:0},movs:[]};
  const cardRow=r1.find(r=>/\bcuenta\s+\d+/.test(r.text));
  if(cardRow){ const m=/^(.*?)\s+cuenta\s+(\d+)/.exec(cardRow.text); st.card=m[1].trim(); st.cuenta=m[2]; }
  st.brand=/visa/i.test(st.card||full.slice(0,400))?'Visa':/master/i.test(st.card||full.slice(0,400))?'Mastercard':(st.card||'Tarjeta');
  const h=labelValues(r1,/CIERRE ACTUAL/,['CIERRE ACTUAL','VENCIMIENTO ACTUAL','SALDO ACTUAL $','SALDO ACTUAL U$S','PAGO M']);
  st.cierre=fecha(h['CIERRE ACTUAL']||''); st.vencimiento=fecha(h['VENCIMIENTO ACTUAL']||'');
  if(h['SALDO ACTUAL $']) st.saldoARS=num(h['SALDO ACTUAL $']); if(h['SALDO ACTUAL U$S']) st.saldoUSD=num(h['SALDO ACTUAL U$S']); if(h['PAGO M']) st.minimo=num(h['PAGO M']);
  const o=labelValues(r1,/CIERRE ANTERIOR/,['CIERRE ANTERIOR','VENCIMIENTO ANTERIOR','PR']);
  st.cierreAnt=fecha(o['CIERRE ANTERIOR']||'');
  const pr=(o['PR']||'').split(' ').map(fecha).filter(Boolean); st.proxCierre=pr[0]||null; st.proxVenc=pr[1]||null;
  const tna=/TNA \$[\s\S]{0,40}?(\d+,\d+)\s?%/.exec(full); if(tna) st.tnaARS=num(tna[1]);
  // cuotas a vencer
  const MR=/^(ENERO|FEBRERO|MARZO|ABRIL|MAYO|JUNIO|JULIO|AGOSTO|SEPTIEMBRE|SETIEMBRE|OCTUBRE|NOVIEMBRE|DICIEMBRE)\/(\d\d)$/;
  const MN=['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  for(let i=0;i<r1.length;i++){
    const ms=r1[i].items.filter(t=>MR.test(t.s.trim())); if(ms.length<2) continue;
    const vals=[]; for(let j=i+1;j<r1.length && r1[j].y>r1[i].y-26;j++) for(const t of r1[j].items){ const s=t.s.replace(/\$/g,'').trim(); if(/^[\d.]+,\d{2}$/.test(s)) vals.push({x:t.x,v:num(s)}); }
    vals.sort((a,b)=>a.x-b.x);
    ms.forEach((m,k)=>{ const mm=MR.exec(m.s.trim()); let mi=MN.indexOf(mm[1])+1; if(!mi) mi=9; if(vals[k]) st.cuotasFuturas.push({mes:`20${mm[2]}-${String(mi).padStart(2,'0')}`,monto:vals[k].v}); });
    break;
  }
  const ap=/A partir de\s+([A-Za-zé]+)\/(\d\d)\s+\$\s*([\d.]+,\d{2})/i.exec(full.replace(/\n/g,' '));
  if(ap){ let mi=MN.indexOf(ap[1].toUpperCase())+1; if(mi) st.cuotasFuturas.push({mes:`20${ap[2]}-${String(mi).padStart(2,'0')}`,monto:num(ap[3]),resto:true}); }
  // resumen: totales de consumos declarados
  let inDet=false;
  st.saldoAnt={ars:0,usd:0};
  for(const r of r1){ if(r.text==='DETALLE') {inDet=true;break;}
    if(/^SALDO ANTERIOR/.test(r.text)){ for(const t of r.items){ if(t.x>=430 && MONEY.test(t.s.trim())){ if(t.x>=520) st.saldoAnt.usd=num(t.s); else st.saldoAnt.ars=num(t.s);} } }
    if(/^TOTAL CONSUMOS/.test(r.text)){ for(const t of r.items){ if(t.x>=430 && MONEY.test(t.s.trim())){ if(t.x>=520) st.totalesConsumo.usd+=num(t.s); else st.totalesConsumo.ars+=num(t.s);} } } }
  // detalle
  let sec=null, det=false;
  for(const r of all){
    const T=r.text;
    if(T==='DETALLE'){det=true;continue;} if(!det) continue;
    if(/^Sus pagos y ajustes/i.test(T)){sec='pago';continue;}
    if(/^Consumos\s/.test(T)){sec='consumo';continue;}
    if(/^Impuestos, cargos e intereses/i.test(T)){sec='impuesto';continue;}
    if(/^Legales y avisos/i.test(T)){sec=null;det=false;continue;}
    if(!sec) continue;
    const first=r.items[0]; const f=first && first.x<105 ? fecha(first.s) : null; if(!f) continue;
    const desc=[], m={ars:0,usd:0}; let cupon=null;
    for(const t of r.items.slice(1)){
      const s=t.s.trim();
      if(t.x>=430 && MONEY.test(s)){ if(t.x>=520) m.usd+=num(s); else m.ars+=num(s); continue; }
      if(t.x>=370 && t.x<440 && /^\d{3,}$/.test(s)){ cupon=s; continue; }
      if(t.x<440) desc.push(s);
    }
    let d=desc.join(' ').replace(/\s+/g,' ').trim(); let cuota=null;
    const c=/\bC\.(\d{1,2})\/(\d{1,2})\b/.exec(d); if(c){ cuota={n:+c[1],de:+c[2]}; d=d.replace(c[0],'').trim(); }
    let origUSD=null; const u=/(\d*)USD\s+([\d.]+,\d{2})\s*$/.exec(d); if(u){ origUSD=num(u[2]); d=d.slice(0,u.index).trim(); }
    let tipo=sec;
    if(sec==='pago') tipo=/^SU PAGO/i.test(d)?'pago':'credito';
    if(sec==='impuesto' && /^CR\./.test(d)) tipo='credito';
    st.movs.push({fecha:f,desc:d,cupon,cuota,ars:Math.round(m.ars*100)/100,usd:Math.round(m.usd*100)/100,tipo,key:tipo==='consumo'?normMerchant(d):d});
  }
  return st;
}


</script>
<script>
const SEED = [];
const LS='bbva-dash-v1';
const store={get(k,d){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){}}};
let statements = store.get(':st', null) || SEED;
let catOverride = store.get(':cat', {});
let ui = {card:'all', period:null, q:''};

const CATS = [
  ['Delivery y comida', /PEDIDOSYA|RAPPI|KFC|MCDONALD|BURGER|TAPAS|RESTO|PARRILLA|PIZZ|CAFE|STARBUCKS|SUSHI|HELAD/],
  ['Suscripciones', /NETFLIX|PRIMEVIDEO|PRIME VIDEO|CRUNCHYROLL|YOUTUBE|SPOTIFY|DISNEY|HBO|\bMAX\b|MICROSOFT|ICLOUD|APPLE|PARAMOUNT|STAR ?\+|CHATGPT|OPENAI|CLAUDE|ANTHROPIC|GOOGLE/],
  ['Juegos', /STEAM|PLAYSTATION|XBOX|NINTENDO|EPIC ?GAMES|RIOT/],
  ['Transporte', /UBER|DIDI|CABIFY|SUBTE|EMOVA|\bSUBE\b|YPF|SHELL|AXION|PUMA ENERG|PEAJE|AUSA|ESTACIONAM/],
  ['Viajes', /DESPEGAR|AEROLINEAS|LATAM|FLYBONDI|JETSMART|BOOKING|AIRBNB|HOTEL|ALMUNDO/],
  ['Supermercado', /COTO|CARREFOUR|\bDIA\b|JUMBO|DISCO|\bVEA\b|CHANGOMAS|LA ANONIMA|SUPERMERC/],
  ['Compras online', /MERCADOLIBRE|SAMSHOP|AMAZON|TIENDA|SHEIN|TEMU|ALIEXPRESS|FRAVEGA|GARBARINO|MUSIMUNDO/],
  ['Salud y mascotas', /VETERIN|FARMACIA|FARMACITY|PET|OSDE|SWISS MEDICAL|GALENO/],
  ['Salidas', /CINEMARK|HOYTS|CINE|TEATRO|TICKETEK|ALLACCESS|BAR\b/],
  ['Regalos y flores', /FLORES|FLORERIA|REGAL/],
];
const CAT_LIST=[...CATS.map(c=>c[0]),'Educación','Servicios','Otros'];
function catOf(m){ if(catOverride[m.key]) return catOverride[m.key]; const s=(m.key+' '+m.desc).toUpperCase(); for(const [c,re] of CATS) if(re.test(s)) return c; return 'Otros'; }

const fARS=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fARS0=new Intl.NumberFormat('es-AR',{maximumFractionDigits:0});
const money=(v,dec=true)=>(v<0?'−':'')+'$ '+(dec?fARS:fARS0).format(Math.abs(v));
const usd=v=>(v<0?'−':'')+'U$S '+fARS.format(Math.abs(v));
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fdate=s=>{if(!s)return '—';const [y,m,d]=s.split('-');return `${+d} ${MES[m-1]} ${y.slice(2)}`};
const fmes=s=>{const [y,m]=s.split('-');return `${MES[m-1]} ${y.slice(2)}`};
const color=b=>b==='Visa'?'var(--visa)':'var(--mc)';
const sid=s=>`${s.brand}|${s.cuenta}|${s.cierre}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function niceDesc(d){ return d.replace(/^(DLO|MERPAGO|PAYU\*AR|PAYU|WL|MP)\s?\*\s?/i,'').replace(/\s+/g,' ').trim(); }
function taxGroup(d){ const u=d.toUpperCase();
  if(/^IIBB/.test(u)) return 'Percepción IIBB (CABA)';
  if(/RG 4240/.test(u)) return 'IVA servicios digitales (RG 4240)';
  if(/^DB\.?RG 5617|RG 5617/.test(u) && !/^CR/.test(u)) return 'Percepción 30% dólar (RG 5617)';
  if(/^CR\.?RG 5617/.test(u)) return 'Devolución percepción RG 5617';
  if(/INTERES/.test(u)) return 'Intereses'; if(/COMISION|MANTENIM/.test(u)) return 'Comisiones';
  return d; }

function save(){ store.set(':st',statements); }
function periods(){ return [...new Set(statements.map(s=>s.cierre))].sort().reverse(); }
function selected(){ const p=ui.period||periods()[0]; return statements.filter(s=>s.cierre===p && (ui.card==='all'||s.brand===ui.card)); }

function renderChips(){
  const el=document.getElementById('chips');
  if(!statements.length){ el.innerHTML='<span class="muted">Todavía no cargaste resúmenes. Podés arrastrar los PDF acá.</span>'; return; }
  el.innerHTML=statements.slice().sort((a,b)=>b.cierre.localeCompare(a.cierre)).map(s=>`<span class="chip"><span class="dot" style="background:${color(s.brand)}"></span>${esc(s.card||s.brand)} ···${esc(String(s.cuenta).slice(-4))} · cierre ${fdate(s.cierre)}<button type="button" aria-label="Quitar resumen" data-rm="${esc(sid(s))}">×</button></span>`).join('');
}
function renderFilters(){
  const brands=[...new Set(statements.map(s=>s.brand))];
  const ps=periods(); if(ui.period && !ps.includes(ui.period)) ui.period=null;
  const p=ui.period||ps[0];
  document.getElementById('filters').innerHTML = statements.length? `
    <div class="seg" role="group" aria-label="Tarjeta">
      <button type="button" data-card="all" aria-pressed="${ui.card==='all'}">Todas</button>
      ${brands.map(b=>`<button type="button" data-card="${b}" aria-pressed="${ui.card===b}"><span class="dot" style="background:${color(b)}"></span>${b}</button>`).join('')}
    </div>
    <label class="muted" for="period" style="font-size:.85rem">Cierre</label>
    <select id="period">${ps.map(x=>`<option value="${x}" ${x===p?'selected':''}>${fdate(x)}</option>`).join('')}</select>` : '';
}

function render(){
  renderChips(); renderFilters();
  const main=document.getElementById('main');
  if(!statements.length){ main.innerHTML='<div class="panel empty">Subí uno o más resúmenes en PDF para ver el tablero: gastos por categoría, comercios, cuotas que vienen e impuestos.</div>'; return; }
  const sts=selected(); const brands=[...new Set(statements.map(s=>s.brand))];
  const movs=sts.flatMap(s=>s.movs.map(m=>({...m,brand:s.brand,stid:sid(s)})));
  const cons=movs.filter(m=>m.tipo==='consumo');
  const sum=(a,k)=>a.reduce((x,m)=>x+(m[k]||0),0);
  const saldoARS=sts.reduce((a,s)=>a+(s.saldoARS||0),0), saldoUSD=sts.reduce((a,s)=>a+(s.saldoUSD||0),0);
  const minimo=sts.reduce((a,s)=>a+(s.minimo||0),0);
  const venc=sts.map(s=>s.vencimiento).filter(Boolean).sort()[0];
  const prox=sts.map(s=>s.proxVenc).filter(Boolean).sort()[0];
  const cARS=sum(cons,'ars'), cUSD=sum(cons,'usd');
  const imp=movs.filter(m=>m.tipo==='impuesto'), cred=movs.filter(m=>m.tipo==='credito');
  const impARS=sum(imp,'ars'), credARS=sum(cred,'ars');
  const cuotasMov=cons.filter(m=>m.cuota); const cuotaARS=sum(cuotasMov,'ars');
  const futuro={}; for(const s of sts) for(const c of s.cuotasFuturas||[]){ const k=c.resto?'resto':c.mes; (futuro[k]??={mes:c.mes,resto:!!c.resto,by:{}}); futuro[k].by[s.brand]=(futuro[k].by[s.brand]||0)+c.monto; }
  const futList=Object.values(futuro).sort((a,b)=>(a.resto-b.resto)||a.mes.localeCompare(b.mes));
  const futTotal=futList.reduce((a,f)=>a+Object.values(f.by).reduce((x,y)=>x+y,0),0);

  // categories
  const cat={}; for(const m of cons){ const c=catOf(m); (cat[c]??={ars:{},usd:0,tot:0}); cat[c].ars[m.brand]=(cat[c].ars[m.brand]||0)+m.ars; cat[c].usd+=m.usd; cat[c].tot+=m.ars; }
  const catList=Object.entries(cat).sort((a,b)=>b[1].tot-a[1].tot||b[1].usd-a[1].usd);
  const catMax=Math.max(1,...catList.map(c=>c[1].tot));
  // merchants
  const mer={}; for(const m of cons){ (mer[m.key]??={name:niceDesc(m.desc),ars:{},usd:0,tot:0,n:0}); mer[m.key].ars[m.brand]=(mer[m.key].ars[m.brand]||0)+m.ars; mer[m.key].usd+=m.usd; mer[m.key].tot+=m.ars; mer[m.key].n++; }
  const merList=Object.values(mer).sort((a,b)=>b.tot-a.tot||b.usd-a.usd).slice(0,8);
  const merMax=Math.max(1,...merList.map(m=>m.tot));
  const stack=(o,max)=>brands.map((b,i)=>o[b]>0?`<span class="seg${b==='Visa'?1:2}" style="width:${(o[b]/max*100).toFixed(2)}%" title="${b}: ${money(o[b])}"></span>`:'').join('');
  const barRow=(lab,o,tot,u,max,extra='')=>`<div class="bar"><span class="lab" title="${esc(lab)}">${esc(lab)}${extra}</span><span class="track">${stack(o,max)}</span><span class="val">${tot?money(tot,false):''}${u?`<small>${tot?'+ ':''}${usd(u)}</small>`:''}</span></div>`;
  const legend=`<div class="legend">${brands.filter(b=>sts.some(s=>s.brand===b)).map(b=>`<span><span class="dot" style="background:${color(b)}"></span>${b}</span>`).join('')}<span><span class="dot" style="background:var(--usd)"></span>En dólares</span></div>`;
  // taxes
  const tg={}; for(const m of [...imp,...cred]){ const g=taxGroup(m.desc); tg[g]=(tg[g]||0)+m.ars; }
  const tgList=Object.entries(tg).sort((a,b)=>b[1]-a[1]);
  // future columns
  const fMax=Math.max(1,...futList.map(f=>Object.values(f.by).reduce((x,y)=>x+y,0)));
  // checks
  const checks=sts.map(s=>{ const t=s.movs.reduce((a,m)=>({ars:a.ars+m.ars,usd:a.usd+m.usd}),{ars:(s.saldoAnt||{}).ars||0,usd:(s.saldoAnt||{}).usd||0});
    const ok=Math.abs(t.ars-s.saldoARS)<0.02 && Math.abs(t.usd-(s.saldoUSD||0))<0.02;
    const cs=s.movs.filter(m=>m.tipo==='consumo'); const okC=Math.abs(cs.reduce((a,m)=>a+m.ars,0)-s.totalesConsumo.ars)<0.02;
    return `<div><span class="dot" style="background:${color(s.brand)}"></span> ${esc(s.card)}: ${ok&&okC?`<span class="ok">Cuadra</span> — saldo anterior + ${s.movs.length} movimientos = ${money(s.saldoARS)} y ${usd(s.saldoUSD||0)}, igual que el resumen.`:`<span class="bad">Revisar</span> — la suma leída da ${money(t.ars)} / ${usd(t.usd)} y el resumen dice ${money(s.saldoARS)} / ${usd(s.saldoUSD||0)}. Puede faltar algún movimiento.`}</div>`; }).join('');
  // table
  const q=ui.q.trim().toLowerCase();
  const rows=movs.filter(m=>!q||(m.desc+' '+catOf(m)).toLowerCase().includes(q)).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  const tipoLab={consumo:'',pago:'Pago',credito:'Crédito',impuesto:'Impuesto'};

  main.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:20px">
  <section class="kpis" aria-label="Resumen del período">
    <div class="kpi"><span class="eyebrow">A pagar</span><span class="v">${money(saldoARS)}</span><span class="s">${saldoUSD?`y <span class="num" style="color:var(--usd)">${usd(saldoUSD)}</span>${saldoUSD<0?' a favor':''} · `:''}vence ${fdate(venc)}</span></div>
    <div class="kpi"><span class="eyebrow">Consumos del período</span><span class="v">${money(cARS,false)}</span><span class="s">${cUSD?`<span class="num" style="color:var(--usd)">${usd(cUSD)}</span> · `:''}${cons.length} movimientos</span></div>
    <div class="kpi"><span class="eyebrow">Cuotas en este resumen</span><span class="v">${money(cuotaARS,false)}</span><span class="s">${cuotasMov.length} plan${cuotasMov.length===1?'':'es'} · ${cARS?Math.round(cuotaARS/cARS*100):0}% de los consumos en pesos</span></div>
    <div class="kpi"><span class="eyebrow">Impuestos y percepciones</span><span class="v">${money(impARS,false)}</span><span class="s">${credARS?`devoluciones ${money(credARS,false)} · `:''}pago mínimo ${money(minimo,false)}</span></div>
    <div class="kpi"><span class="eyebrow">Cuotas por venir</span><span class="v">${money(futTotal,false)}</span><span class="s">próximo vencimiento ${fdate(prox)}</span></div>
  </section>

  <div class="grid">
    <section class="panel"><header><h2>Gasto por categoría</h2>${legend}</header>
      <div class="bars">${catList.map(([c,v])=>barRow(c,v.ars,v.tot,v.usd,catMax)).join('')||'<span class="muted">Sin consumos.</span>'}</div>
      <p class="note">Las categorías se asignan por el nombre del comercio. Cambialas en la tabla de movimientos y se recuerdan para próximos resúmenes.</p>
    </section>
    <section class="panel"><header><h2>Cuotas a vencer</h2><span class="muted" style="font-size:.85rem">según el resumen</span></header>
      ${futList.length?`<div><div class="cols">${futList.map(f=>{const t=Object.values(f.by).reduce((x,y)=>x+y,0);return `<div class="col${f.resto?' rest':''}"><span class="tot">${money(t,false)}</span><div class="stack" style="height:${(t/fMax*100).toFixed(1)}%">${brands.map(b=>f.by[b]?`<span style="flex:${f.by[b]};background:${color(b)}" title="${b}: ${money(f.by[b])}"></span>`:'').join('')}</div></div>`}).join('')}</div>
      <div class="collabs">${futList.map(f=>`<span>${f.resto?fmes(f.mes)+' en adelante':fmes(f.mes)}</span>`).join('')}</div></div>`:'<span class="muted">No hay cuotas pendientes.</span>'}
      <div class="bars">${cuotasMov.map(m=>`<div class="bar"><span class="lab">${esc(niceDesc(m.desc))}</span><span class="track"><span class="seg${m.brand==='Visa'?1:2}" style="width:${(m.cuota.n/m.cuota.de*100).toFixed(1)}%"></span></span><span class="val">cuota ${m.cuota.n} de ${m.cuota.de}<small style="color:var(--muted)">${money(m.ars,false)} por mes</small></span></div>`).join('')}</div>
    </section>
    <section class="panel"><header><h2>Dónde más gastaste</h2><span class="muted" style="font-size:.85rem">top ${merList.length} comercios</span></header>
      <div class="bars">${merList.map(m=>barRow(m.name,m.ars,m.tot,m.usd,merMax,m.n>1?` <span class="pill">×${m.n}</span>`:'')).join('')}</div>
    </section>
    <section class="panel"><header><h2>Impuestos, percepciones y devoluciones</h2></header>
      <div class="taxes">${tgList.map(([g,v])=>`<div class="taxrow"><span>${esc(g)}</span><span class="num ${v<0?'neg':''}">${money(v)}</span></div>`).join('')}
      <div class="taxrow total"><span>Neto</span><span class="num">${money(impARS+credARS)}</span></div></div>
      <p class="note">La percepción del 30% (RG 5617) se cobra sobre consumos en dólares pagados en pesos. Si pagás esos consumos con dólares propios, el banco la devuelve como crédito.</p>
    </section>
  </div>

  <section class="panel"><header><h2>Movimientos</h2><input type="search" id="q" placeholder="Buscar comercio o categoría" value="${esc(ui.q)}" aria-label="Buscar movimientos"></header>
    <div class="tablewrap"><table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Tarjeta</th><th>Categoría</th><th>Cuota</th><th class="r">Pesos</th><th class="r">Dólares</th></tr></thead>
      <tbody>${rows.map(m=>`<tr>
        <td class="num" style="white-space:nowrap">${fdate(m.fecha)}</td>
        <td>${esc(niceDesc(m.desc))}${m.tipo!=='consumo'?` <span class="pill ${m.ars<0||m.usd<0?'ref':''}">${tipoLab[m.tipo]}</span>`:''}${m.tipo==='consumo'&&(m.ars<0||m.usd<0)?' <span class="pill ref">Devolución</span>':''}</td>
        <td><span class="dot" style="background:${color(m.brand)}"></span> ${m.brand}</td>
        <td>${m.tipo==='consumo'?`<select data-key="${esc(m.key)}" aria-label="Categoría de ${esc(niceDesc(m.desc))}">${CAT_LIST.map(c=>`<option ${c===catOf(m)?'selected':''}>${c}</option>`).join('')}</select>`:'<span class="muted">—</span>'}</td>
        <td>${m.cuota?`<span class="pill">${m.cuota.n}/${m.cuota.de}</span>`:''}</td>
        <td class="r num ${m.ars<0?'neg':''}">${m.ars?money(m.ars):''}</td>
        <td class="r num ${m.usd<0?'neg':''}" style="${m.usd>0?'color:var(--usd)':''}">${m.usd?usd(m.usd):''}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>

  <section class="panel"><header><h2>Control de lectura</h2></header><div class="checks">${checks}</div></section>
  </div>`;
}

// events
document.addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]'); if(rm){ statements=statements.filter(s=>sid(s)!==rm.dataset.rm); save(); render(); return; }
  const cb=e.target.closest('[data-card]'); if(cb){ ui.card=cb.dataset.card; render(); return; }
  if(e.target.id==='clear'){ document.getElementById('clearbox').innerHTML='<span class="confirm">¿Borrar todos los resúmenes? <button class="btn small" id="clearyes" type="button">Sí, borrar</button><button class="btn small" id="clearno" type="button">Cancelar</button></span>'; return; }
  if(e.target.id==='clearyes'||e.target.id==='clearno'){ if(e.target.id==='clearyes'){ statements=[]; save(); render(); }
    document.getElementById('clearbox').innerHTML='<button class="btn small" id="clear" type="button">Borrar todo</button>'; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='period'){ ui.period=e.target.value; render(); }
  if(e.target.dataset&&e.target.dataset.key){ catOverride[e.target.dataset.key]=e.target.value; store.set(':cat',catOverride); render(); }
  if(e.target.id==='file'){ handleFiles(e.target.files); e.target.value=''; }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('q'); q.focus(); try{q.setSelectionRange(pos,pos)}catch(_){} } });
const drop=document.getElementById('drop');
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();if(t==='drop'||!e.relatedTarget)drop.classList.remove('over')}));
document.addEventListener('drop',e=>{ if(e.dataTransfer&&e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function readPdf(file){
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const pages=[];
  for(let p=1;p<=doc.numPages;p++){ const tc=await (await doc.getPage(p)).getTextContent(); pages.push(tc.items.map(i=>({x:i.transform[4],y:i.transform[5],s:i.str}))); }
  return pages;
}
async function handleFiles(files){
  const st=document.getElementById('status'); st.className='status'; st.textContent='Leyendo…';
  if(!window.pdfjsLib){ st.className='status err'; st.textContent='No se pudo cargar el lector de PDF. Revisá tu conexión y recargá la página.'; return; }
  const errs=[]; let n=0, last=null;
  for(const f of files){
    try{ const s=parseStatement(await readPdf(f));
      if(!s.cierre||s.saldoARS==null) throw new Error('formato');
      s.cuenta=String(s.cuenta||'').slice(-4); s.archivo=f.name;
      statements=statements.filter(x=>sid(x)!==sid(s)).concat(s); n++; last=s.cierre;
    }catch(err){ errs.push(f.name); }
  }
  save(); if(last) ui.period=periods()[0];
  st.className='status'+(errs.length?' err':'');
  st.textContent=(n?`${n} resumen${n>1?'es':''} cargado${n>1?'s':''}. `:'')+(errs.length?`No reconocí ${errs.join(', ')} como resumen de tarjeta BBVA.`:'');
  render();
}
render();
</script>
